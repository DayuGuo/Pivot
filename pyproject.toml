[project]
name = "publishing-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0", "uvicorn==0.51.0", "sqlalchemy==2.0.49",
  "psycopg[binary]==3.2.12", "alembic==1.17.1", "httpx==0.28.1",
]
[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/api", "evals"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
