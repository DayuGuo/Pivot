name: static-demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint && npm run typecheck
      - run: ./scripts/demo.sh
      - name: Verify isolated static artifact
        run: E2E_BASE_URL=http://127.0.0.1:3110 DEMO_PATH=/ npm run test:e2e -- tests/e2e/demo.spec.ts
      - name: Package amd64 VPS image
        run: ./scripts/build-demo.sh --image
      - name: Assemble VPS installation bundle
        run: ./scripts/package-vps-demo.sh
      - name: Verify amd64 offline image on x86 runner
        run: |
          mkdir -p artifacts/vps-install-check
          tar -xzf artifacts/pivot-vps-linux-amd64.tar.gz -C artifacts/vps-install-check
          PIVOT_PORT=3112 bash artifacts/vps-install-check/pivot-demo-linux-amd64/install.sh
          curl --fail http://127.0.0.1:3112/health
          E2E_BASE_URL=http://127.0.0.1:3112 DEMO_PATH=/ npm run test:e2e -- tests/e2e/demo.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-demo-and-evidence
          path: |
            artifacts/pivot-demo-static.tar.gz
            artifacts/pivot-demo-image-linux-amd64.tar.gz
            artifacts/pivot-vps-linux-amd64.tar.gz
            artifacts/pivot-demo-SHA256SUMS
            artifacts/static-demo-playwright-report/
            artifacts/static-demo-playwright-results/
      - if: always()
        run: |
          ./scripts/demo.sh stop
          docker ps -aq --filter label=org.pivot.surface=demo-release | xargs -r docker rm -f
