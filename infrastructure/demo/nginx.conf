server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1k;
    location / { try_files $uri $uri/ =404; }
    location /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { return 404; }
    error_page 404 /404.html;
}
